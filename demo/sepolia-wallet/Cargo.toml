[package]
name = "sepolia-wallet-demo"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the runnable testnet demo outside the production release workspace. The
# production binaries and their fail-closed release gates remain unchanged.
[workspace]

[dependencies]
argon2 = { version = "=0.5.3", features = ["zeroize"] }
bip39 = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", features = ["getrandom"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
getrandom = "=0.3.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
pbkdf2 = "=0.12.2"
secp256k1 = { version = "=0.31.1", features = ["recovery", "std"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
ureq = { version = "=3.1.2", default-features = false, features = ["rustls", "json"] }
zeroize = { version = "=1.8.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.1", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
