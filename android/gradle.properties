# spec/15 §4.3-§4.4, §13 (2026-11-24 A2-3). No daemon, no build cache, no configuration cache: each build starts from
# this text and the verified dependency cache only.
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.configuration-cache=false
# §4.4 N3: Gradle never downloads or picks a JDK by itself; JAVA_HOME (set by scripts/build-android.ps1) is the one.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false
android.useAndroidX=true
# §4.2 (P0-7): AGP 9's built-in Kotlin support would put kotlin-stdlib on the runtime classpath of this Java-only app.
kotlin.stdlib.default.dependency=false
