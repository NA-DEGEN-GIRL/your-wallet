[package]
name = "approval-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
runtime-entrypoint = []
# Noninteractive presenter used only by debug-profile child-process contract tests.
runtime-contract-test-hook = ["runtime-entrypoint"]
# Debug-only fixed-Approval SCM helper bootstrap and authenticated HelperReady
# RPC probe; not signing, release attestation, or production activation.
service-helper-rpc-probe-feasibility-test-hook = [
    "dep:key-agent-service-helper-bootstrap",
]

[dependencies]
approval-wire = { path = "../approval-wire" }
getrandom.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_Isolation",
    "Win32_Security_WinTrust",
    "Win32_System_RemoteDesktop",
] }

[target.'cfg(all(windows, target_arch = "x86_64", target_env = "msvc"))'.dependencies]
key-agent-service-helper-bootstrap = { path = "../key-agent-service-helper-bootstrap", optional = true, features = [
    "child-capture-feasibility-test-hook",
    "helper-ready-rpc-feasibility-test-hook",
    "approval-exchange-feasibility-test-hook",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
