[package]
name = "yw-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# libyw.so (spec/15 §3.1-§3.2). rlib too, so the platform-neutral helpers and their unit tests build on
# every target (spec/15 §13 Windows gate; 2026-11-24 A2-1).
[lib]
name = "yw"
crate-type = ["cdylib", "rlib"]

[dependencies]
yw-core.workspace = true
yw-engine.workspace = true
yw-json.workspace = true
yw-platform.workspace = true

# spec/15 §4.1, §18 41: the only direct third-party dependency, Android targets only.
[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true

# Copied like yw-win's (spec/01 §3.2): inherited lints cannot be overridden per item, and an inherited forbid
# cannot be lifted in a module.
[lints.rust]
unsafe_code = "deny"                 # lifted only by #![allow(unsafe_code)] in an FFI module (spec/01 §5.1)
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
# The 12 lines (all … exit) of the root [workspace.lints.clippy] plus the 2 below, as yw-win.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
mem_forget = "deny"
exit = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
