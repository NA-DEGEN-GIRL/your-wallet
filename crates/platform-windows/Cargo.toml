[package]
name = "platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = false

[features]
default = []
# Dormant, network-free Windows Broker composition used only by debug tests.
broker-channel-contract-test-hook = []
# Inert, no-secret SCM lifecycle fixture used only by debug feasibility tests.
key-agent-service-scm-feasibility-test-hook = []
# Current-process restricted-service-token policy fixture. This debug-only
# surface verifies documented token facts before SCM publishes RUNNING, but it
# does not claim the still-unproven installer or helper-launch composition.
key-agent-service-token-feasibility-test-hook = [
    "key-agent-service-scm-feasibility-test-hook",
]
# Debug-only dormant Phase 1 launch composition through the authenticated
# parent two-gate handoff. Its V2 launch commands have no runtime/manager
# reachability, production caller, or executable entrypoint, and the feature
# remains kernel-matrix STOP-SHIP.
key-agent-service-lpac-launch-feasibility-test-hook = [
    "dep:key-agent-service-helper-bootstrap",
    "key-agent-service-rpc-status-feasibility-test-hook",
    "key-agent-service-wire/debug-feasibility-v2",
    "key-agent-service-token-feasibility-test-hook",
]
# Bounded, no-secret local-RPC Status/Unavailable fixture. This remains a
# debug feasibility surface and does not authenticate a production Broker.
key-agent-service-rpc-status-feasibility-test-hook = [
    "key-agent-service-scm-feasibility-test-hook",
    "dep:key-agent-service-rpc-sys",
    "dep:key-agent-service-wire",
]
# Dormant, secretless debugger/target-topology and forced-parent-death evidence.
# Its inert target is debug-only and untrusted; no production or RPC entrypoint
# reaches the transport.
key-agent-debugger-transport-feasibility-test-hook = [
    "dep:key-agent-debugger-wire",
]

[dependencies]
approval-wire = { path = "../approval-wire" }
getrandom.workspace = true
hmac.workspace = true
key-agent-debugger-wire = { workspace = true, optional = true }
key-agent-service-helper-bootstrap = { path = "../key-agent-service-helper-bootstrap", optional = true, default-features = false }
key-agent-service-rpc-sys = { path = "../key-agent-service-rpc-sys", optional = true }
key-agent-service-wire = { path = "../key-agent-service-wire", optional = true }
sha2.workspace = true
secret-input-ui = { path = "../secret-input-ui" }
subtle.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_Isolation",
    "Win32_Security_WinTrust",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
] }
zeroize.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
