[package]
name = "broker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Secret/network-free subprocess used only by debug-profile bridge contract tests.
ipc-contract-test-hook = ["dep:getrandom"]
windows-broker-channel-contract-test-hook = [
    "ipc-contract-test-hook",
    "dep:platform-windows",
    "platform-windows/broker-channel-contract-test-hook",
]

[dependencies]
getrandom = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chain-registry = { path = "../chain-registry" }
wallet-model = { path = "../wallet-model" }
wallet-protocol = { path = "../wallet-protocol" }
platform-windows = { path = "../platform-windows", optional = true }

[lints]
workspace = true
