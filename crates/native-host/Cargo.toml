[package]
name = "native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Real subprocess bridge used only by debug-profile headless contract tests.
broker-ipc-contract-test-hook = ["broker/ipc-contract-test-hook", "dep:getrandom"]

[dependencies]
broker = { path = "../broker" }
getrandom = { workspace = true, optional = true }
platform-windows = { path = "../platform-windows" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wallet-model = { path = "../wallet-model" }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
