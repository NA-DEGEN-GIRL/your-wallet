[package]
name = "key-agent-debugger"
description = "Dormant one-shot Windows Key Agent debugger transport feasibility helper"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"
publish = false

[features]
default = []
transport-feasibility-test-hook = []

[dependencies]
key-agent-debugger-wire = { path = "../key-agent-debugger-wire", default-features = false }

[build-dependencies]
find-msvc-tools = "=0.1.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.1", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
