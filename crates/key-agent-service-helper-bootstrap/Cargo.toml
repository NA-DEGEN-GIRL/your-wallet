[package]
name = "key-agent-service-helper-bootstrap"
description = "Dormant child-side bootstrap primitives for Windows Key Agent service helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = false
publish = false

[features]
default = []
child-capture-feasibility-test-hook = []

[dependencies]
key-agent-service-wire = { path = "../key-agent-service-wire" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
