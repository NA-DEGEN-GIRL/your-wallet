[package]
name = "key-agent-service-helper-bootstrap"
description = "Dormant child-side bootstrap primitives for Windows Key Agent service helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = false
publish = false

[features]
default = []
# Debug-only Windows x64 debugger-injected bootstrap gates.
child-capture-feasibility-test-hook = []
# Extends the captured bootstrap with fixed-endpoint WINNT packet-private
# HelperReady/ACK and YWKHRC01 confirmation; never a production entrypoint.
helper-ready-rpc-feasibility-test-hook = [
    "child-capture-feasibility-test-hook",
    "dep:key-agent-service-rpc-sys",
    "key-agent-service-wire/debug-feasibility-v2",
]
# Extends the debug HelperReady probe with one framed native Approval exchange.
approval-exchange-feasibility-test-hook = [
    "helper-ready-rpc-feasibility-test-hook",
    "dep:approval-wire",
]

[dependencies]
approval-wire = { path = "../approval-wire", optional = true }
key-agent-service-wire = { path = "../key-agent-service-wire" }
zeroize.workspace = true

[target.'cfg(all(windows, target_arch = "x86_64", target_env = "msvc"))'.dependencies]
key-agent-service-rpc-sys = { path = "../key-agent-service-rpc-sys", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
