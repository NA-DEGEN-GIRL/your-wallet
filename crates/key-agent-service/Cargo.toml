[package]
name = "key-agent-service"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = false
default-run = "key-agent-service"

[[bin]]
name = "key-agent-service-probe"
path = "src/bin/key_agent_service_probe.rs"

[features]
default = []
# Separate desktop-only client; this feature does not enable an SCM host or
# helper creation authority. Ordinary and release binaries remain unavailable.
desktop-rpc-probe-feasibility-test-hook = [
    "platform-windows/key-agent-service-desktop-rpc-probe-feasibility-test-hook",
]
scm-feasibility-test-hook = [
    "platform-windows/key-agent-service-scm-feasibility-test-hook",
]
service-token-feasibility-test-hook = [
    "scm-feasibility-test-hook",
    "platform-windows/key-agent-service-token-feasibility-test-hook",
]
rpc-status-feasibility-test-hook = [
    "scm-feasibility-test-hook",
    "platform-windows/key-agent-service-rpc-status-feasibility-test-hook",
]
# Debug-only role-aware V2 service/helper RPC composition with OS-derived fixed-
# package-SID Low/NW endpoint/If3 ACLs. This is no-secret executable wiring,
# not installed restricted-SCM or signed-helper E2E evidence.
lpac-rpc-probe-feasibility-test-hook = [
    "rpc-status-feasibility-test-hook",
    "service-token-feasibility-test-hook",
    "platform-windows/key-agent-service-lpac-launch-feasibility-test-hook",
]

[dependencies]
platform-windows = { path = "../platform-windows" }

[lints]
workspace = true
