[target.x86_64-pc-windows-msvc]
# serial: Solana 단계 의존성 가드(spec/01 §3.4). /Brepro: 링커가 PE 타임스탬프 대신 내용 해시를 써서 같은
# 입력이면 같은 바이너리가 나온다(spec/01 §3.9). 실행 파일은 빌드한 PC에서만 쓰고 배포하지 않으므로(spec.md D1)
# 패닉 위치 문자열의 이 PC 경로를 지우는 --remap-path-prefix는 쓰지 않는다.
rustflags = ["--cfg", 'curve25519_dalek_backend="serial"', "-C", "link-arg=/Brepro"]
