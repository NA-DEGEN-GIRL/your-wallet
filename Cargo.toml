[workspace]
resolver = "3"
members = [
    "crates/approval-wire",
    "crates/approval-ui",
    "crates/broker",
    "crates/chain-registry",
    "crates/dashboard",
    "crates/eip712",
    "crates/key-agent",
    "crates/key-agent-debugger",
    "crates/key-agent-debugger-wire",
    "crates/key-agent-service",
    "crates/key-agent-service-helper-bootstrap",
    "crates/key-agent-service-rpc-sys",
    "crates/key-agent-service-wire",
    "crates/native-host",
    "crates/platform-windows",
    "crates/secret-core",
    "crates/secret-input-ui",
    "crates/wallet-model",
    "crates/wallet-protocol",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
bip39 = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "getrandom"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
getrandom = "=0.3.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
key-agent-debugger-wire = { path = "crates/key-agent-debugger-wire" }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
ripemd = "=0.1.3"
secp256k1 = { version = "=0.31.1", default-features = false, features = ["alloc", "recovery", "std"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
subtle = "=2.6.1"
thiserror = "=2.0.12"
unicode-normalization = "=0.1.24"
windows = { version = "=0.61.1", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = { version = "=1.8.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
strip = "symbols"
